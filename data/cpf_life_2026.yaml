# CPF LIFE payout reference: CPF Board table published in 2026.
# See update.md. When CPF republishes the table, update this whole file and rename it
# cpf_life_<year>.yaml (then update the filename in build.js and README.md).

table:
  year: 2026
  plan: standard                 # Standard Plan, male, payout from the LIFE reference age
  # Monthly payout for a given RA balance at the reference age.
  # The model interpolates linearly between rows.
  points:
    - ra_balance: 82400
      monthly_payout: 490
    - ra_balance: 170100
      monthly_payout: 950
    - ra_balance: 227900
      monthly_payout: 1250
    - ra_balance: 330100
      monthly_payout: 1780
    - ra_balance: 445600
      monthly_payout: 2380
    - ra_balance: 650100
      monthly_payout: 3440

adjustments:
  female_discount_pct: 5         # women's payouts are about 5% lower
  deferral_uplift_pct_per_year: 6  # payouts rise about 6% per year of deferral past the reference age
  table_calibration_factor: 0.98 # aligns the interpolated table with CPF's published FRS/ERS payout examples

escalating_plan:
  # From the same publication, at the FRS balance:
  # Standard pays $1,780/month, Escalating pays $1,380/month.
  standard_frs_monthly: 1780
  escalating_frs_monthly: 1380
  annual_increase_pct: 2         # Escalating payouts then rise 2% a year
