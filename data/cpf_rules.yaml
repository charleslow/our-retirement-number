# Statutory CPF parameters (Singapore). See update.md for what to refresh each year.

ages:
  ra_formation_age: 55           # Retirement Account is formed; ERS top-ups happen before the LIFE reference age
  life_reference_age: 65         # CPF LIFE payout reference age used by the published tables

retirement_sums:
  # Announced Full Retirement Sum (FRS) values, in nominal dollars.
  # Add a row for every newly announced year; years after the last announced row grow at
  # retirement_sum_growth_pct (a user-facing assumption, defaulted in default.yaml).
  # BRS = FRS x brs_fraction_of_frs, ERS = FRS x ers_multiple_of_frs.
  brs_fraction_of_frs: 0.5
  ers_multiple_of_frs: 2
  announced:
    - year: 2026
      frs: 220400
    - year: 2027
      frs: 228200

interest:
  ordinary_account_pct: 2.5
  special_account_pct: 4.0       # SA, RA and MA earn the same rate

extra_interest:
  # Extra interest on top of the account rates, earned across accounts in priority order
  # (the order the model passes them in), up to each tier's balance.
  ordinary_account_cap: 20000    # OA earns extra interest on at most this balance
  before_ra_formation:           # across OA, SA, MA
    - tier_balance: 60000
      extra_pct: 1.0
  after_ra_formation:            # across RA, OA, MA
    - tier_balance: 30000
      extra_pct: 2.0
    - tier_balance: 30000
      extra_pct: 1.0
